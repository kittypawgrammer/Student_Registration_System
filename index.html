<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <link href="./dist/output.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-slate-50 via-cyan-50 to-slate-100 min-h-screen">

    <!-- Header-->

    <header class="bg-gradient-to-r from-cyan-900 via-cyan-800 to-cyan-700 text-white p-6 shadow-xl">
        <div class="max-w-6xl mx-auto text-center">

            <div class="flex items-center justify-center gap-3 pb-4">

                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>

                <h1
                    class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-white to-cyan-200 bg-clip-text text-transparent">
                    Student Registration System
                </h1>

            </div>

            <h3 class="text-xl md:text-2xl text-cyan-100 font-light">
                Smart Student Data Management Platform
            </h3>

            <p class="mt-3 text-sm text-cyan-200 bg-cyan-800/50 inline-block px-4 py-1 rounded-full">
                A simple and responsive system to register and manage student records efficiently.
            </p>

        </div>
    </header>

    <!-- Main Section -->

    <main class="max-w-6xl mx-auto p-6">

        <!-- Student Registration Form Section -->

        <section
            class="p-6 md:p-8 border border-cyan-200 rounded-2xl shadow-xl bg-white hover:shadow-2xl transition-shadow duration-300">

            <div class="flex items-center gap-2 mb-6">

                <svg class="w-6 h-6 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>

                <h2 class="text-2xl font-semibold text-gray-800">
                    Register Student
                </h2>

            </div>

            <form id="studentForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Input Field: Student ID -->

                <div>

                    <label class="block font-medium text-gray-700 mb-1">Student ID</label>

                    <div class="relative">

                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0">
                                </path>
                            </svg>
                        </span>

                        <input
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all hover:shadow-md hover:shadow-md"
                            type="text" name="studentId" placeholder="Enter ID" required pattern="[0-9]{4}"
                            title="Student ID must be exactly 4 alphanumeric characters">

                    </div>
                </div>

                <!-- Input Field: Name -->

                <div>

                    <label class="block font-medium text-gray-700 mb-1">Student Name</label>

                    <div class="relative">

                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </span>

                        <input
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all hover:shadow-md"
                            type="text" name="name" placeholder="Enter student name" required pattern="[A-Za-z\s]+"
                            title="Student Name contains only alphabets">

                    </div>

                </div>


                <!--Input Field:  Email -->

                <div>

                    <label class="block font-medium text-gray-700 mb-1">Email</label>

                    <div class="relative">

                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </span>

                        <input
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all hover:shadow-md"
                            type="email" name="email" placeholder="Enter email" required>

                    </div>

                </div>

                <!-- Input Field: Contact -->

                <div>

                    <label class="block font-medium text-gray-700 mb-1">Contact Number</label>

                    <div class="relative">

                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                                </path>
                            </svg>
                        </span>

                        <input
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all hover:shadow-md"
                            type="tel" name="contact" placeholder="Enter contact" required pattern="\d{10}"
                            title="Contact must be exactly 10 digits">

                    </div>

                </div>

                <!-- Submit Button -->

                <div class="md:col-span-2">

                    <button
                        class="bg-cyan-800 w-full md:w-auto md:px-12 h-auto text-white px-6 py-3 rounded-lg hover:bg-green-600 hover:shadow-lg transition-all duration-300 font-semibold flex items-center justify-center gap-2"
                        type="submit">

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>

                        Add Student

                    </button>

                </div>

            </form>

        </section>

        <!-- Registered Students Display Section -->

        <section
            class="p-6 md:p-8 mt-6 border border-cyan-200 rounded-2xl shadow-xl bg-white hover:shadow-2xl transition-shadow duration-300">

            <div class="flex items-center gap-2 mb-6">

                <svg class="w-6 h-6 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>

                <!--Table Header -->

                <h2 class="text-2xl font-semibold text-gray-800">
                    Registered Students
                </h2>

            </div>

            <!-- Responsive Table Container with Horizontal & Vertical Scroll -->

            <div id="tableContainer" class=" max-h-72 rounded-xl border border-gray-200">

                <table class="w-full">

                    <thead class="sticky top-0 bg-gradient-to-r from-cyan-800 to-cyan-700 text-white z-10">
                        <tr class="items-center">
                            <th class="p-3">Name</th>
                            <th class="p-3">ID</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Contact</th>
                            <th class="p-3">Actions</th>

                        </tr>
                    </thead>

                    <tbody id="studentTable" class="text-left divide-y divide-gray-100">
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <script src="./js/script.js"></script>

</body>

</html>
